[project]
name = "goodteam-os"
version = "0.1.0"
description = "Local-first control layer for AI software delivery"
requires-python = ">=3.11"
dependencies = [
  "pyTelegramBotAPI>=4.0",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]
embeddings = ["fastembed>=0.3"]

[project.scripts]
goodteam-os = "goodteam_os.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
