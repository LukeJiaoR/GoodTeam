[project]
name = "goodteam-os"
version = "0.1.0"
description = "Local-first control layer for AI software delivery"
requires-python = ">=3.11"
dependencies = [
  "pyTelegramBotAPI>=4.0",
  "openai>=2,<3",
  "httpx[socks]>=0.28,<1",
  "rank-bm25>=0.2.2",
  "PyYAML>=6.0.2,<7",
  "langgraph==1.2.20",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary,pool]>=3.3.8,<4",
  "pypdf>=6,<8",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]
embeddings = ["fastembed>=0.3"]

[project.scripts]
goodteam = "goodteam_os.cli:main"
goodteam-os = "goodteam_os.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
