name: PR 426 isolated reconciliation
on:
  push:
    branches: [codex/delivery-outcomes]
    paths:
      - scripts/ci/pr426_reconcile.py
      - .github/workflows/pr426-reconcile.yml
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'LukeJiaoR/GoodTeam' && github.ref == 'refs/heads/codex/delivery-outcomes'
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply pinned, reviewed reconciliation on the PR branch only
        env:
          RECONCILE_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: python3 scripts/ci/pr426_reconcile.py
      - uses: actions/upload-artifact@v4
        with:
          name: pr426-source-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/pr426-source-reconciliation/
          retention-days: 1
          if-no-files-found: error
