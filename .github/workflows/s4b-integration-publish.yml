name: S4b integration patch publication

on:
  push:
    branches: [feat/461-task-skill-dispatch]
    paths: [.github/workflows/s4b-integration-publish.yml]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'LukeJiaoR/GoodTeam' && github.ref == 'refs/heads/feat/461-task-skill-dispatch'
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply the exact source-reviewed integration delta on this feature branch only
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 08fd8d2ddcc5d77e1e86dd00f494ccf4ec7a2a81 HEAD
          python3 - <<'PY'
          import ast, base64, hashlib, lzma, pathlib, subprocess
          chunks = [pathlib.Path('.goodteam-ci/s4b-wave2-' + str(i) + '.b64') for i in range(1, 5)]
          helper = '.github/workflows/s4b-integration-publish.yml'
          baseline_delta = set(subprocess.check_output(['git', 'diff', '--name-only', '08fd8d2ddcc5d77e1e86dd00f494ccf4ec7a2a81', 'HEAD']).decode().splitlines())
          assert baseline_delta == {helper, *(str(p) for p in chunks)}, baseline_delta
          encoded = b''.join(p.read_bytes() for p in chunks)
          assert len(encoded) == 38428
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '281718cd5c2ac68cb2aa87ceb20ae29aab36af84819ac70ab19af299e268937f'
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          patch = decoder.decompress(compressed, max_length=200000)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == 133541
          assert hashlib.sha256(patch).hexdigest() == '4f376d8eff385921474ed860c5399594c6653b4ff6b7e98630e14306466ba357'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          expected = {
            'docs/task-skill-dispatch.md': '274bc5062ebeaa090f21988d5775956962d9a4d7',
            'frontend/e2e/task-skill-locks.spec.js': 'd7cc14de54db9670eff5aeaad63e6bc2e56c56d0',
            'src/goodteam_os/assistant_conversation.py': '3f075ca1d104869ce6537e229bd92395d014f8da',
            'src/goodteam_os/assistant_drafts.py': 'd6aca41e61257112417630dda235ee8a7e397684',
            'src/goodteam_os/assistant_workspace.py': '8da1f205e74c0d6b19290b8a173f898e27b863d9',
            'src/goodteam_os/cli.py': '7c6e5927ef431c96777af2825ea5edfe6e18046f',
            'src/goodteam_os/debate.py': '96fc9c9e09d3b20002c42a16415e6527d53ec7ba',
            'src/goodteam_os/dispatch.py': 'b52491688f3c42d999a0fe2263b382cd925c809b',
            'src/goodteam_os/execution/evidence.py': '692e7373654ec5b639a760b832c449f92c9bee13',
            'src/goodteam_os/execution/orchestrator.py': 'e4748d3cf2efdb39e5656ace9fc0d791ee79e710',
            'src/goodteam_os/graph.py': '1b236f5ac69aa7f029fe1c575e63696526285b62',
            'src/goodteam_os/manager_execution.py': '0a5211eff84debea4d0055d55b78e63ceacb7a5b',
            'src/goodteam_os/operator.py': 'f8a59618b2989b76a0aab159900b0879c877c740',
            'src/goodteam_os/review_provenance.py': '825cf9c18b7e29e869f032afbc4c750df79c0bb0',
            'src/goodteam_os/reviewer_dispatch.py': '4737da64acd7e506080595f2b5bdeb07bb246c11',
            'src/goodteam_os/reviewer_retry_inputs.py': 'f1185130cea22e883aa30cef5c08174ecf54664d',
            'src/goodteam_os/skills/task_locks.py': '57162b2d33970b6954e9cbe172ca915c7c870ed9',
            'src/goodteam_os/skills/task_start.py': '81840340e94c7ed44e9c1404ddb74da73e25f3a2',
            'src/goodteam_os/skills/worker_creation_lock.py': '9a35b7ff4e65eee33024b19c7e67059b503893cd',
            'src/goodteam_os/skills/worker_requests.py': '0b8a10719db4e7b2af9616498621a07ee0e72cb9',
            'src/goodteam_os/task_assistant.py': 'e0a95f49a46fc9fb08ea1350bc99da31229a6f4f',
            'src/goodteam_os/task_assistant_session.py': '5462ca057612fd19aba36948d00a8fab167ba185',
            'src/goodteam_os/web.py': '65c642ab547c6c3c630f89cdd4fc9ffe4a248993',
            'src/goodteam_os/workers.py': 'd8602bf629393a194a754f5214c32e18d9a9254c',
            'tests/conftest.py': '2deacea80e29bdf161933525aff205ecdc5236f0',
            'tests/test_assistant_recovery.py': 'b846bc658e745a472113a272eaeacbe79e59015a',
            'tests/test_manager_execution.py': '061b674566dd95ff96c4ac413caaac802d13a3b6',
            'tests/test_task_skill_entrypoints.py': 'c10a951c1bc28ef3ce3cfd53efbf939c263a5a33',
            'tests/test_worker_skill_requests.py': '3f9b97b1825187a49c6ecc2f7e16dc34b0ec48cb',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          assert changed == set(expected), changed
          for name, digest in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', name]).decode().strip()
              assert actual == digest, (name, actual, digest)
              if name.endswith('.py'):
                  ast.parse(pathlib.Path(name).read_text(), filename=name)
          subprocess.run(['node', '--check', 'frontend/e2e/task-skill-locks.spec.js'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'rm', '--', *(str(p) for p in chunks)], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'feat(skills): connect confirmed task producers and recovery to locked Worker methods'
          git push origin HEAD:refs/heads/feat/461-task-skill-dispatch
