name: CI
run-name: CI ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to validate when preparing to merge a PR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.target_sha || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare CI mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    steps:
      - name: Resolve candidate or bootstrap mode
        id: plan
        uses: actions/github-script@v8
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.eventName === "workflow_dispatch") {
              const target = process.env.TARGET_SHA;
              if (context.ref !== "refs/heads/main") {
                core.setFailed("Candidate CI must be dispatched from the reviewed main workflow definition");
                return;
              }
              if (!/^[0-9a-f]{40}$/u.test(target)) {
                core.setFailed("target_sha must be an exact lowercase 40-character commit SHA");
                return;
              }
              await github.rest.repos.getCommit({ owner, repo, ref: target });
              const main = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: main.data.commit.sha + "..." + target,
              });
              if (comparison.data.merge_base_commit.sha !== main.data.commit.sha) {
                core.setFailed("target_sha must include the current main HEAD before candidate validation");
                return;
              }
              core.setOutput("mode", "candidate");
              core.setOutput("target_sha", target);
              core.setOutput("base_sha", main.data.commit.sha);
              return;
            }

            const pull = context.payload.pull_request;
            const target = pull.head.sha;
            const base = pull.base.sha;
            let active = false;
            try {
              await github.rest.repos.getContent({
                owner,
                repo,
                path: ".github/ci/candidate-gate-v1",
                ref: base,
              });
              active = true;
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice("Candidate gate bootstrap: base does not contain the activation marker yet.");
            }
            core.setOutput("mode", active ? "gate" : "legacy");
            core.setOutput("target_sha", target);
            core.setOutput("base_sha", base);

  mark-candidate:
    name: Mark candidate pending
    needs: prepare
    if: needs.prepare.outputs.mode == 'candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish pending candidate status
        uses: actions/github-script@v8
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.TARGET_SHA,
              state: "pending",
              context: "merge-candidate/validated",
              description: "Candidate CI is running",
              target_url: "https://github.com/" + owner + "/" + repo + "/actions/runs/" + context.runId,
            });

  classify:
    needs: [prepare, mark-candidate]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (
        (
          needs.prepare.outputs.mode == 'legacy' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (needs.prepare.outputs.mode == 'candidate' && needs.mark-candidate.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      backend_test_targets: ${{ steps.plan.outputs.backend_test_targets }}
      live_smoke_evidence_required: ${{ steps.plan.outputs.live_smoke_evidence_required }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify exact candidate diff
        id: plan
        shell: bash
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          base="$BASE_SHA"
          test -n "$base"
          if [[ "$MODE" == "candidate" ]]; then
            git merge-base --is-ancestor "$base" "$TARGET_SHA"
          fi
          git diff --check "$base...$TARGET_SHA"
          python3 scripts/ci/classify_changes.py             --base "$base"             --head "$TARGET_SHA"             --github-output "$GITHUB_OUTPUT"             --summary "$GITHUB_STEP_SUMMARY"

  browser:
    needs: [prepare, classify]
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.classify.result == 'success'
      && (needs.classify.outputs.backend != 'none' || needs.classify.outputs.frontend != 'none')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      GOODTEAM_DISABLE_TG_NETWORK: "1"
      GOODTEAM_TG_BOT_TOKEN: ""
      GOODTEAM_TG_CHAT_ID: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create isolated browser backend environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/goodteam-e2e-venv"
          echo "$RUNNER_TEMP/goodteam-e2e-venv/bin" >> "$GITHUB_PATH"
          echo "GOODTEAM_E2E_PYTHON=$RUNNER_TEMP/goodteam-e2e-venv/bin/python" >> "$GITHUB_ENV"

      - run: pip install -e ".[dev]"

      - name: Verify HTTP crash and timeout recovery
        run: |
          evidence="$RUNNER_TEMP/goodteam-http-recovery"
          mkdir -p "$evidence"
          PYTHONPATH=src python -m pytest tests/test_workflow_http_recovery.py -q \
            --basetemp="$evidence/workspaces" \
            --junitxml="$evidence/results.xml"

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify isolated business loop
        run: npm run test:e2e
        working-directory: frontend
      - name: Run frontend unit tests
        if: needs.classify.outputs.frontend != 'none'
        run: npm test
        working-directory: frontend
      - name: Lint frontend
        if: needs.classify.outputs.frontend != 'none'
        run: npm run lint
        working-directory: frontend

  backend:
    needs: [prepare, classify, browser]
    if: >-
      always()
      && needs.classify.result == 'success'
      && needs.classify.outputs.backend != 'none'
      && needs.browser.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOODTEAM_DISABLE_TG_NETWORK: "1"
      GOODTEAM_TG_BOT_TOKEN: ""
      GOODTEAM_TG_CHAT_ID: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create isolated Python 3.12 environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/goodteam-venv"
          echo "$RUNNER_TEMP/goodteam-venv/bin" >> "$GITHUB_PATH"

      - run: pip install -e ".[dev]"
      - name: Run focused backend tests
        if: needs.classify.outputs.backend == 'focused'
        env:
          TEST_TARGETS: ${{ needs.classify.outputs.backend_test_targets }}
        shell: bash
        run: |
          if [[ -z "$TEST_TARGETS" ]]; then
            echo "Focused backend verification requires at least one fixed test target." >&2
            exit 1
          fi
          read -r -a targets <<< "$TEST_TARGETS"
          PYTHONPATH=src python -m pytest "${targets[@]}" -q
      - name: Run full backend tests
        if: needs.classify.outputs.backend == 'full'
        run: PYTHONPATH=src python -m pytest tests --ignore=tests/test_workflow_http_recovery.py -q
      - run: ruff check src/goodteam_os/ tests/ scripts/ci/ ops/ci-runner/runner_cleanup.py

  gate:
    name: CI / gate
    needs: [prepare, classify, backend, browser]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    env:
      MODE: ${{ needs.prepare.outputs.mode }}
      TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      BACKEND_MODE: ${{ needs.classify.outputs.backend }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_MODE: ${{ needs.classify.outputs.frontend }}
      BROWSER_RESULT: ${{ needs.browser.result }}
      TIER: ${{ needs.classify.outputs.tier }}
      LIVE_SMOKE_REQUIRED: ${{ needs.classify.outputs.live_smoke_evidence_required }}
    steps:
      - name: Validate planned jobs
        id: validate
        if: env.MODE != 'gate'
        shell: bash
        run: |
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CLASSIFY_RESULT" >&2
            exit 1
          fi

          if [[ "$BACKEND_MODE" == "none" && "$BACKEND_RESULT" == "skipped" ]]; then
            echo "Backend was intentionally skipped."
          elif [[ ( "$BACKEND_MODE" == "focused" || "$BACKEND_MODE" == "full" ) && "$BACKEND_RESULT" == "success" ]]; then
            echo "Backend $BACKEND_MODE verification succeeded."
          else
            echo "Backend result $BACKEND_RESULT does not match plan $BACKEND_MODE." >&2
            exit 1
          fi

          if [[ "$FRONTEND_MODE" != "none" && "$FRONTEND_MODE" != "full" ]]; then
            echo "Unknown frontend verification mode: $FRONTEND_MODE" >&2
            exit 1
          fi

          if [[ "$BACKEND_MODE" == "none" && "$FRONTEND_MODE" == "none" && "$BROWSER_RESULT" == "skipped" ]]; then
            echo "Browser acceptance was intentionally skipped for documentation."
          elif [[ ( "$BACKEND_MODE" != "none" || "$FRONTEND_MODE" != "none" ) && "$BROWSER_RESULT" == "success" ]]; then
            echo "Isolated browser acceptance and planned frontend checks succeeded."
          else
            echo "Browser result $BROWSER_RESULT does not match the verification plan." >&2
            exit 1
          fi

      - name: Require exact candidate status
        if: env.MODE == 'gate'
        uses: actions/github-script@v8
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const baseSha = context.payload.pull_request.base.sha;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: baseSha + "..." + process.env.TARGET_SHA,
            });
            if (comparison.data.merge_base_commit.sha !== baseSha) {
              core.setFailed("PR head does not include the current base SHA; update the branch and revalidate the new head.");
              return;
            }
            const statuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              { owner, repo, ref: process.env.TARGET_SHA, per_page: 100 },
              (response) => response.data,
            );
            const candidate = statuses.find((status) => status.context === "merge-candidate/validated");
            if (!candidate || candidate.state !== "success") {
              core.setFailed("Exact PR head " + process.env.TARGET_SHA + " has not passed candidate CI.");
              return;
            }
            core.notice("Exact candidate status accepted from " + (candidate.target_url || "recorded status"));

      - name: Summarize gate
        if: always()
        shell: bash
        run: |
          {
            echo "## CI gate"
            echo
            echo "- Mode: $MODE"
            echo "- Exact target: $TARGET_SHA"
            if [[ "$MODE" != "gate" ]]; then
              echo "- Tier: $TIER"
              echo "- Backend: $BACKEND_MODE ($BACKEND_RESULT)"
              echo "- Frontend unit/lint plan: $FRONTEND_MODE"
              echo "- Browser acceptance: $BROWSER_RESULT"
              echo "- Live smoke evidence required: $LIVE_SMOKE_REQUIRED"
            else
              echo "- Heavy CI: validated on this exact SHA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  record-candidate:
    name: Record candidate result
    needs: [prepare, mark-candidate, gate]
    if: >-
      always()
      && needs.prepare.outputs.mode == 'candidate'
      && needs.mark-candidate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish exact-SHA candidate result
        uses: actions/github-script@v8
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          GATE_RESULT: ${{ needs.gate.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const success = process.env.GATE_RESULT === "success";
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.TARGET_SHA,
              state: success ? "success" : "failure",
              context: "merge-candidate/validated",
              description: success ? "Exact-SHA candidate CI passed" : "Exact-SHA candidate CI failed",
              target_url: "https://github.com/" + owner + "/" + repo + "/actions/runs/" + context.runId,
            });
            if (!success) core.setFailed("Candidate gate result: " + process.env.GATE_RESULT);
