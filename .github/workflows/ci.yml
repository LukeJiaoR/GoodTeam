name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      backend_test_targets: ${{ steps.plan.outputs.backend_test_targets }}
      live_smoke_evidence_required: ${{ steps.plan.outputs.live_smoke_evidence_required }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: plan
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python3 scripts/ci/classify_changes.py \
              --full \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          else
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
            python3 scripts/ci/classify_changes.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

  backend:
    needs: [classify, browser]
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && needs.classify.outputs.backend != 'none'
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    env:
      GOODTEAM_DISABLE_TG_NETWORK: "1"
      GOODTEAM_TG_BOT_TOKEN: ""
      GOODTEAM_TG_CHAT_ID: ""

    steps:
      - uses: actions/checkout@v6

      - name: Create isolated Python 3.12 environment
        shell: bash
        run: |
          if [[ "$(python3.12 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" != "3.12" ]]; then
            echo "The goodteam-ci runner must provide Python 3.12." >&2
            exit 1
          fi
          job_temp="${GOODTEAM_CI_JOB_TEMP:-$RUNNER_TEMP}"
          python3 ops/ci-runner/runner_cleanup.py run -- python3.12 -m venv "$job_temp/goodteam-venv"
          echo "$job_temp/goodteam-venv/bin" >> "$GITHUB_PATH"

      - run: python3 ops/ci-runner/runner_cleanup.py run -- pip install -e ".[dev]"

      - name: Run focused backend tests
        if: needs.classify.outputs.backend == 'focused'
        env:
          TEST_TARGETS: ${{ needs.classify.outputs.backend_test_targets }}
        shell: bash
        run: |
          if [[ -z "$TEST_TARGETS" ]]; then
            echo "Focused backend verification requires at least one fixed test target." >&2
            exit 1
          fi
          read -r -a targets <<< "$TEST_TARGETS"
          PYTHONPATH=src python3 ops/ci-runner/runner_cleanup.py run -- python -m pytest "${targets[@]}" -q

      - name: Run full backend tests
        if: needs.classify.outputs.backend == 'full'
        # The required browser job already ran recovery with dedicated evidence.
        run: >-
          PYTHONPATH=src python3 ops/ci-runner/runner_cleanup.py run --
          python -m pytest tests --ignore=tests/test_workflow_http_recovery.py -q

      - run: ruff check src/goodteam_os/ tests/ scripts/ci/ ops/ci-runner/runner_cleanup.py

  browser:
    needs: classify
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (needs.classify.outputs.backend != 'none' || needs.classify.outputs.frontend != 'none')
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    timeout-minutes: 15
    env:
      GOODTEAM_DISABLE_TG_NETWORK: "1"
      GOODTEAM_TG_BOT_TOKEN: ""
      GOODTEAM_TG_CHAT_ID: ""

    steps:
      - uses: actions/checkout@v6

      - name: Create isolated browser backend environment
        shell: bash
        run: |
          job_temp="${GOODTEAM_CI_JOB_TEMP:-$RUNNER_TEMP}"
          python3 ops/ci-runner/runner_cleanup.py run -- python3.12 -m venv "$job_temp/goodteam-e2e-venv"
          echo "$job_temp/goodteam-e2e-venv/bin" >> "$GITHUB_PATH"
          echo "GOODTEAM_E2E_PYTHON=$job_temp/goodteam-e2e-venv/bin/python" >> "$GITHUB_ENV"

      - run: python3 ops/ci-runner/runner_cleanup.py run -- pip install -e ".[dev]"

      - name: Verify HTTP crash and timeout recovery
        run: |
          evidence="${GOODTEAM_CI_EVIDENCE:-$RUNNER_TEMP}/goodteam-http-recovery"
          mkdir -p "$evidence"
          PYTHONPATH=src python3 ops/ci-runner/runner_cleanup.py run -- \
            python -m pytest tests/test_workflow_http_recovery.py -q \
            --basetemp="$evidence/workspaces" --junitxml="$evidence/results.xml"

      - name: Upload HTTP recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GOODTEAM_CI_EVIDENCE || runner.temp }}/goodteam-http-recovery/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - run: python3 ../ops/ci-runner/runner_cleanup.py run -- npm ci
        working-directory: frontend

      - run: python3 ../ops/ci-runner/runner_cleanup.py run -- npm run build
        working-directory: frontend

      - run: python3 ../ops/ci-runner/runner_cleanup.py run -- npx playwright install chromium
        working-directory: frontend

      - name: Verify isolated business loop
        run: python3 ../ops/ci-runner/runner_cleanup.py run -- npm run test:e2e
        working-directory: frontend

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Run frontend unit tests
        if: needs.classify.outputs.frontend != 'none'
        run: python3 ../ops/ci-runner/runner_cleanup.py run -- npm test
        working-directory: frontend

      - name: Lint frontend
        if: needs.classify.outputs.frontend != 'none'
        run: python3 ../ops/ci-runner/runner_cleanup.py run -- npm run lint
        working-directory: frontend

  gate:
    name: CI / gate
    needs: [classify, backend, browser]
    if: >-
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      BACKEND_MODE: ${{ needs.classify.outputs.backend }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_MODE: ${{ needs.classify.outputs.frontend }}
      BROWSER_RESULT: ${{ needs.browser.result }}
      TIER: ${{ needs.classify.outputs.tier }}
      LIVE_SMOKE_REQUIRED: ${{ needs.classify.outputs.live_smoke_evidence_required }}

    steps:
      - name: Validate planned jobs
        shell: bash
        run: |
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CLASSIFY_RESULT" >&2
            exit 1
          fi

          if [[ "$BACKEND_MODE" == "none" && "$BACKEND_RESULT" == "skipped" ]]; then
            echo "Backend was intentionally skipped."
          elif [[ ( "$BACKEND_MODE" == "focused" || "$BACKEND_MODE" == "full" ) && "$BACKEND_RESULT" == "success" ]]; then
            echo "Backend $BACKEND_MODE verification succeeded."
          else
            echo "Backend result $BACKEND_RESULT does not match plan $BACKEND_MODE." >&2
            exit 1
          fi

          if [[ "$FRONTEND_MODE" != "none" && "$FRONTEND_MODE" != "full" ]]; then
            echo "Unknown frontend verification mode: $FRONTEND_MODE" >&2
            exit 1
          fi

          if [[ "$BACKEND_MODE" == "none" && "$FRONTEND_MODE" == "none" && "$BROWSER_RESULT" == "skipped" ]]; then
            echo "Browser acceptance was intentionally skipped for documentation."
          elif [[ ( "$BACKEND_MODE" != "none" || "$FRONTEND_MODE" != "none" ) && "$BROWSER_RESULT" == "success" ]]; then
            echo "Isolated browser acceptance and planned frontend checks succeeded."
          else
            echo "Browser result $BROWSER_RESULT does not match the verification plan." >&2
            exit 1
          fi

      - name: Summarize gate
        shell: bash
        run: |
          {
            echo "## CI gate"
            echo
            echo "- Tier: **$TIER**"
            echo "- Backend: \`$BACKEND_MODE\` ($BACKEND_RESULT)"
            echo "- Frontend unit/lint plan: \`$FRONTEND_MODE\` (included in browser job)"
            echo "- Browser acceptance: $BROWSER_RESULT (isolated workspace, fake Worker)"
            echo "- Live smoke evidence required: \`$LIVE_SMOKE_REQUIRED\`"
            if [[ "$LIVE_SMOKE_REQUIRED" == "true" ]]; then
              echo
              echo "> Reviewer action: inspect the browser-acceptance artifact; adapter-specific live evidence may still be required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
