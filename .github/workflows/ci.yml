name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - codex/operator-smoke-base-019f6134

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - run: PYTHONPATH=src python -m pytest tests -q

      - run: ruff check src/goodteam_os/ tests/

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm run lint
