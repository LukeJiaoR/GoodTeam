name: Temporary Skill review source audit

on:
  push:
    branches: [feat/445-446-controlled-review-loop]
    paths: [.github/workflows/skill-review-source-audit.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Capture only Git-tracked source, never run repository code
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/skill-review-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/skill-review-source/tracked-source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/skill-review-source/head.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/skill-review-source/tree.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/skill-review-source/manifest.txt"
          sha256sum "$RUNNER_TEMP/skill-review-source/tracked-source.tar" > "$RUNNER_TEMP/skill-review-source/sha256.txt"
          printf '%s\n' 'Source transport only; not product tests or Runtime acceptance. Provider calls: 0.' > "$RUNNER_TEMP/skill-review-source/purpose.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: skill-review-source-${{ github.run_id }}
          path: ${{ runner.temp }}/skill-review-source/
          retention-days: 7
          if-no-files-found: error
