name: Temporary reviewed product blob transport
on:
  push:
    branches: [feat/445-446-controlled-review-loop]
    paths: [scripts/ci/review-engineering-transfer.b64]
permissions:
  contents: write
jobs:
  blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate exact patch and create content-addressed blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          raw = base64.b64decode(pathlib.Path('scripts/ci/review-engineering-transfer.b64').read_bytes(), validate=False)
          assert hashlib.sha256(raw).hexdigest() == '7e09b9e1910cb2425a90ec7aef00629b11b1d3476792e7b46332954aa4110b73'
          payload = json.loads(gzip.decompress(raw))
          assert payload['schema'] == 'goodteam-engineering-blob-transfer-v1'
          entries = payload['entries']
          assert len(entries) == 17
          paths = [entry['path'] for entry in entries]
          assert len(set(paths)) == len(paths)
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for entry in entries:
              p = pathlib.Path(entry['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in {'src', 'frontend', 'tests', 'docs'} and not p.is_symlink()
              if entry['base'] is None:
                  assert not p.exists()
              else:
                  assert blob(p.read_bytes()) == entry['base']
          patch = payload['patch'].encode()
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          receipt = []
          for entry in entries:
              content = pathlib.Path(entry['path']).read_bytes()
              assert blob(content) == entry['sha']
              body = json.dumps({'encoding': 'base64', 'content': base64.b64encode(content).decode()}).encode()
              request = urllib.request.Request('https://api.github.com/repos/LukeJiaoR/GoodTeam/git/blobs', body,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == entry['sha']
              receipt.append({'path': entry['path'], 'sha': result['sha'], 'mode': '100644', 'type': 'blob'})
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-blobs'
          output.mkdir()
          (output / 'blobs.json').write_text(json.dumps(receipt, indent=2))
          (output / 'purpose.txt').write_text('Exact reviewed source blob transport only. No branch updates, merges, deployments, model calls or product-test claims. Remove this workflow and transfer payload before final CI.\n')
          print('Verified content-addressed blobs:', len(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: review-blobs-${{ github.run_id }}
          path: ${{ runner.temp }}/review-blobs/
          if-no-files-found: error
          retention-days: 7
