name: Candidate published
run-name: Candidate ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    if: startsWith(github.ref, 'refs/heads/codex/candidate-') && (github.event_name == 'push' || github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: 'true'
