name: Apply isolated conversation change patch
on:
  push:
    branches: [codex/conversation-change-status]
    paths: ['.github/gtchanges/**', '.github/workflows/gtchanges-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'LukeJiaoR/GoodTeam' && github.ref == 'refs/heads/codex/conversation-change-status'
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Apply exact bounded increment without changing the base branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess, tempfile
          base = 'e525a3d3e27ce33631ee942f43c2c8bf476b2ed0'
          base_ref = 'refs/heads/codex/work-context-417'
          branch = 'refs/heads/codex/conversation-change-status'
          expected_hash = '11a97a28932dc4b474171753372664653b35d6529422c82a74a7dfd1dbc50b35'
          allowed = set('''docs/conversation-change-status.md
          frontend/e2e/conversation-change-handoff.spec.js
          frontend/src/features/runs/workspace/ConversationChangeContext.jsx
          frontend/src/features/runs/workspace/ConversationChangeHandoff.test.jsx
          frontend/src/features/runs/workspace/ConversationComposer.jsx
          frontend/src/features/runs/workspace/TeamWorkspace.jsx
          frontend/src/features/runs/workspace/conversationChangeContext.css
          frontend/src/features/runs/workspace/conversationChangeContext.js
          frontend/src/features/runs/workspace/conversationChangeContext.vitest.js
          frontend/src/i18n/locales/en.js
          frontend/src/i18n/locales/zh-CN.js'''.splitlines())
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def run(*args):
              subprocess.run(['git', *args], check=True)
          def remote(ref):
              value = git('ls-remote', '--exit-code', 'origin', ref).split()
              if len(value) != 2 or value[1] != ref:
                  raise SystemExit('Unexpected remote reference')
              return value[0]
          head = os.environ['GITHUB_SHA']
          if os.environ['GITHUB_REF'] != branch or git('rev-parse', 'HEAD') != head:
              raise SystemExit('Unexpected checkout')
          if git('rev-parse', 'HEAD^') != base or remote(base_ref) != base or remote(branch) != head:
              raise SystemExit('Base or feature branch moved')
          if git('status', '--porcelain'):
              raise SystemExit('Checkout not clean')
          encoded = ''.join(pathlib.Path(f'.github/gtchanges/patch-{i}').read_text() for i in range(4))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != expected_hash:
              raise SystemExit('Patch hash mismatch')
          with tempfile.NamedTemporaryFile(suffix='.patch') as out:
              out.write(patch)
              out.flush()
              run('apply', '--check', '--index', out.name)
              run('apply', '--index', out.name)
          if set(git('diff', '--cached', '--name-only').splitlines()) != allowed:
              raise SystemExit('Patch path mismatch')
          run('rm', '-r', '--', '.github/gtchanges', '.github/workflows/gtchanges-apply.yml')
          if set(git('diff', '--cached', '--name-only', base).splitlines()) != allowed:
              raise SystemExit('Final scope mismatch')
          run('diff', '--cached', '--check')
          run('config', 'user.name', 'GoodTeam implementation')
          run('config', 'user.email', 'noreply@users.noreply.github.com')
          run('commit', '-m', 'feat(work): distinguish conversation from confirmed task changes', '-m', 'Step 2 after #434. Preserve exact composer text through the existing bound change-draft API, keep confirmation separate and report durable change status without claiming successful execution. Static-only local review; ordinary CI required. Temporary transport removed.')
          if remote(base_ref) != base or remote(branch) != head:
              raise SystemExit('Concurrent update; no push performed')
          run('push', 'origin', 'HEAD:' + branch)
          print('PRODUCT_HEAD=' + git('rev-parse', 'HEAD'))
          print('PRODUCT_TREE=' + git('rev-parse', 'HEAD^{tree}'))
          print('PATCH_SHA256=' + expected_hash)
          PY
