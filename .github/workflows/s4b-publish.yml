name: S4b bounded patch publication

on:
  push:
    branches: [feat/461-task-skill-dispatch]
    paths: [.github/workflows/s4b-publish.yml]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'LukeJiaoR/GoodTeam' && github.ref == 'refs/heads/feat/461-task-skill-dispatch'
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only the reviewed source delta to this feature branch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor c2a2b435338a9221a358fa02a817ff1a09aa3183 HEAD
          test "$(git rev-parse HEAD:src/goodteam_os/workers.py)" = c4b049cbee0c2f40735c89a3c1d1ad5ccf1cf062
          test "$(git rev-parse HEAD:src/goodteam_os/skills/task_locks.py)" = 5d910dd5409a1df617c92e3562209a9ba49b936f
          echo '747feb678aa0ce17d5602ec9488a87f52837f519e5fc68550acfed59aa8b9539  .goodteam-ci/s4b-worker-integration.patch' | sha256sum -c -
          git apply --check --index .goodteam-ci/s4b-worker-integration.patch
          git apply --index .goodteam-ci/s4b-worker-integration.patch
          test "$(git hash-object src/goodteam_os/workers.py)" = 51e9ff5cccd6f84659a7252c089d43b1408bca3b
          test "$(git hash-object src/goodteam_os/skills/task_locks.py)" = 3bed176c56def8906d165cf98538bfc5593bd013
          test "$(git hash-object src/goodteam_os/skills/worker_requests.py)" = ade089176aa59c3b7de85fc784cbbbfbf0f56298
          test "$(git hash-object tests/test_worker_skill_requests.py)" = 9e1c20be10cd7019450c4ac4b23919ce44fd0882
          python3 -c 'import ast,pathlib; [ast.parse(pathlib.Path(p).read_text(), filename=p) for p in ("src/goodteam_os/workers.py", "src/goodteam_os/skills/task_locks.py", "src/goodteam_os/skills/worker_requests.py", "tests/test_worker_skill_requests.py")]'
          git diff --cached --check
          git rm -- .goodteam-ci/s4b-worker-integration.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'feat(skills): bind Worker creation and execution preflight to task snapshots'
          git push origin HEAD:refs/heads/feat/461-task-skill-dispatch
