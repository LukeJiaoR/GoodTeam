name: PR 426 isolated dependency snapshot
on:
  push:
    branches: [codex/delivery-outcomes]
    paths: [.github/workflows/pr426-offline-deps.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'LukeJiaoR/GoodTeam' && github.ref == 'refs/heads/codex/delivery-outcomes'
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Snapshot locked frontend dependencies and missing Python wheels
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr426-offline-deps"
          mkdir -p "$out/wheels"
          python3.12 -m venv "$RUNNER_TEMP/pr426-dependency-venv"
          "$RUNNER_TEMP/pr426-dependency-venv/bin/pip" download --only-binary=:all: --no-deps -d "$out/wheels" 'pytelegrambotapi>=4.0' 'rank-bm25>=0.2.2' 'ruff>=0.5.0'
          npm ci --prefix frontend
          tar -C frontend -czf "$out/node_modules.tar.gz" node_modules
          cp frontend/package-lock.json "$out/package-lock.json"
          sha256sum "$out/package-lock.json" "$out/node_modules.tar.gz" "$out"/wheels/* > "$out/checksums.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pr426-offline-deps-${{ github.run_id }}
          path: ${{ runner.temp }}/pr426-offline-deps/
          retention-days: 1
          if-no-files-found: error
