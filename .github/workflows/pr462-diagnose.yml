name: PR462 bounded baseline diagnostic
on:
  push:
    branches: [feat/461-task-skill-dispatch]
    paths: [.github/workflows/pr462-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'LukeJiaoR/GoodTeam' && github.ref == 'refs/heads/feat/461-task-skill-dispatch'
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    timeout-minutes: 15
    env:
      GOODTEAM_DISABLE_TG_NETWORK: '1'
      GOODTEAM_TG_BOT_TOKEN: ''
      GOODTEAM_TG_CHAT_ID: ''
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export immutable inputs and aggregate runner counters
        shell: bash
        run: |
          set -euo pipefail
          export DIAG="$RUNNER_TEMP/pr462-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 -p "$DIAG/evidence" "$DIAG/base" "$DIAG/head"
          echo "DIAG=$DIAG" >> "$GITHUB_ENV"
          git archive c2a2b435338a9221a358fa02a817ff1a09aa3183 > "$DIAG/evidence/base.tar"
          git archive a3a9c07ba0ccbcf8d18dfd9c56f0b0b8cb307c6a > "$DIAG/evidence/head.tar"
          tar -xf "$DIAG/evidence/base.tar" -C "$DIAG/base"
          tar -xf "$DIAG/evidence/head.tar" -C "$DIAG/head"
          git rev-parse c2a2b435338a9221a358fa02a817ff1a09aa3183 c2a2b435338a9221a358fa02a817ff1a09aa3183^{tree} a3a9c07ba0ccbcf8d18dfd9c56f0b0b8cb307c6a a3a9c07ba0ccbcf8d18dfd9c56f0b0b8cb307c6a^{tree} > "$DIAG/evidence/identity.txt"
          git ls-tree -r a3a9c07ba0ccbcf8d18dfd9c56f0b0b8cb307c6a > "$DIAG/evidence/head-tree.txt"
          python3.12 - <<'PY'
          import hashlib, json, os, pathlib, tempfile, time
          out = pathlib.Path(os.environ['DIAG']) / 'evidence'
          counters = {'cpu_count': os.cpu_count(), 'cpu_affinity_count': len(os.sched_getaffinity(0)), 'load_average': os.getloadavg()}
          for path in ['/proc/pressure/cpu', '/proc/pressure/io', '/proc/pressure/memory', '/sys/fs/cgroup/cpu.max', '/sys/fs/cgroup/cpu.stat']:
              try:
                  counters[path] = pathlib.Path(path).read_text()
              except OSError:
                  counters[path] = 'unavailable'
          counters['memory'] = [line for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.split(':')[0] in {'MemTotal', 'MemAvailable', 'SwapTotal', 'SwapFree'}]
          w, c = time.monotonic(), time.process_time()
          for _ in range(100000):
              hashlib.sha256(b'bounded PR462 numeric diagnostic' * 128).digest()
          counters['hash_benchmark'] = {'wall_seconds': time.monotonic()-w, 'cpu_seconds': time.process_time()-c}
          w = time.monotonic()
          with tempfile.TemporaryDirectory(dir=os.environ['DIAG']) as tmp:
              for index in range(8):
                  with open(pathlib.Path(tmp) / str(index), 'wb') as stream:
                      stream.write(b'0' * 4096)
                      stream.flush()
                      os.fsync(stream.fileno())
          counters['eight_fsync_seconds'] = time.monotonic()-w
          (out / 'runner-before.json').write_text(json.dumps(counters, indent=2))
          print(json.dumps(counters, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr462-diagnostic-source-${{ github.run_id }}
          path: ${{ env.DIAG }}/evidence/
          retention-days: 2
          if-no-files-found: error
      - name: Create one isolated environment for both revisions
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv "$DIAG/venv"
          "$DIAG/venv/bin/python" -m pip install -e "$DIAG/head[dev]"
          "$DIAG/venv/bin/python" -m pip freeze > "$DIAG/evidence/dependencies.txt"
      - name: Compare HTTP recovery then exercise actual S4b contracts
        shell: bash
        run: |
          python3.12 - <<'PY'
          import json, os, pathlib, subprocess, time
          root = pathlib.Path(os.environ['DIAG'])
          python = str(root / 'venv/bin/python')
          cases = [('base-http', 'base', ['-m', 'pytest', 'tests/test_workflow_http_recovery.py', '-q', '--durations=10']), ('head-http', 'head', ['-m', 'pytest', 'tests/test_workflow_http_recovery.py', '-q', '--durations=10']), ('head-s4b', 'head', ['-m', 'pytest', 'tests/test_worker_skill_requests.py', 'tests/test_task_skill_entrypoints.py', 'tests/test_project_task_skill_service.py', 'tests/test_task_skill_context_state.py', 'tests/test_task_skill_locks.py', 'tests/test_task_skill_registry_loss.py', '-q', '--durations=15']), ('head-ruff', 'head', ['-m', 'ruff', 'check', 'src/goodteam_os/', 'tests/', 'scripts/ci/'])]
          results = []
          for label, revision, args in cases:
              env = dict(os.environ, PYTHONPATH=str(root / revision / 'src'))
              started = time.monotonic()
              with (root / 'evidence' / (label + '.log')).open('w') as log:
                  try:
                      result = subprocess.run([python, *args], cwd=root/revision, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=240, check=False)
                      code = result.returncode
                  except subprocess.TimeoutExpired:
                      code = 124
                      log.write('\nDIAGNOSTIC COMMAND DEADLINE, NOT PASS\n')
              record = {'case': label, 'revision': revision, 'exit_code': code, 'wall_seconds': time.monotonic()-started}
              results.append(record)
              (root / 'evidence' / 'summary.json').write_text(json.dumps(results, indent=2))
              print(json.dumps(record), flush=True)
              print((root / 'evidence' / (label+'.log')).read_text()[-24000:], flush=True)
          raise SystemExit(int(any(item['exit_code'] != 0 for item in results)))
          PY
      - name: Preserve diagnostic evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr462-diagnostic-results-${{ github.run_id }}
          path: ${{ env.DIAG }}/evidence/
          retention-days: 2
          if-no-files-found: warn
