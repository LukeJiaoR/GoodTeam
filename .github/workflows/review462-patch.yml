name: PR462 bounded projection repair
on:
  push:
    branches: [feat/461-task-skill-dispatch]
    paths: [.github/workflows/review462-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'LukeJiaoR/GoodTeam' && github.ref == 'refs/heads/feat/461-task-skill-dispatch'
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Apply source-hash-bound projection repair
        env:
          PATCH_DATA: 
        run: |
          python3 - <<'PY'
          import ast, base64, hashlib, json, os, pathlib, zlib
          data = json.loads(zlib.decompress(base64.b64decode(os.environ['PATCH_DATA'], validate=True)))
          allowed = {'src/goodteam_os/web.py', 'src/goodteam_os/skills/worker_requests.py', 'tests/test_task_skill_entrypoints.py'}
          assert {item['path'] for item in data} == allowed
          prepared = []
          for item in data:
              path = pathlib.Path(item['path'])
              before = path.read_bytes()
              assert hashlib.sha256(before).hexdigest() == item['before'], str(path)
              after = before
              for edit in reversed(item['edits']):
                  after = after[:edit['start']] + edit['text'].encode() + after[edit['end']:]
              assert hashlib.sha256(after).hexdigest() == item['after'], str(path)
              ast.parse(after)
              prepared.append((path, after))
          for path, after in prepared:
              path.write_bytes(after)
          PY
          git diff --check
          test "$(git ls-remote origin refs/heads/feat/461-task-skill-dispatch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Luke_J'
          git config user.email 'LukeJiaoR@users.noreply.github.com'
          git add src/goodteam_os/web.py src/goodteam_os/skills/worker_requests.py tests/test_task_skill_entrypoints.py
          git commit -m 'fix(skills): preserve bound task identity and blocked evidence in public Worker summaries'
          git push origin HEAD:refs/heads/feat/461-task-skill-dispatch
