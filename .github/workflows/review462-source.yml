name: PR462 fixed source inspection
on:
  push:
    branches: [feat/461-task-skill-dispatch]
    paths: [.github/workflows/review462-source.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'LukeJiaoR/GoodTeam' && github.ref == 'refs/heads/feat/461-task-skill-dispatch'
    runs-on: [self-hosted, linux, x64, goodteam-ci]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 02784fa3c39511d769c3eae648fd85f0c43aab04
          persist-credentials: false
      - name: Export only committed source
        run: |
          test "$(git rev-parse HEAD)" = 02784fa3c39511d769c3eae648fd85f0c43aab04
          mkdir -p "$RUNNER_TEMP/pr462-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/pr462-source/source.tar"
          git ls-tree -r HEAD > "$RUNNER_TEMP/pr462-source/tree.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pr462-source/identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pr462-source-02784fa3
          path: ${{ runner.temp }}/pr462-source/
          retention-days: 1
          if-no-files-found: error
