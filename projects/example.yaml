# GoodTeam project config — committed reference template.
#
# Copy this to `projects/<yourkey>.local.yaml` (the `.local.yaml` suffix is
# gitignored so your machine-specific paths stay private), or just run:
#
#   goodteam-os init --key MYAPP --name "My App" --repo /path/to/repo
#
# The parser is a small indentation-based YAML subset: every non-comment line
# is `key: value` or a `key:` that opens a nested block. No list syntax.

name: Example App
key: EXAMPLE
model_profile: balanced          # see profiles in models.yaml
delivery_mode: custom            # mvp | init_project | multi_service | static_site | cli_tool | library | data_pipeline | mobile_app | feature_increment | custom
delivery_standards:
  standard_0001: Deliver a locally runnable first slice with documented setup and verification commands.
  standard_0002: Preserve the host project's existing contracts and include focused regression tests.
  standard_0003: Record rollout, rollback, and follow-up risks in the handoff.
source_type: existing_project    # new_project | existing_project

# Repos GoodTeam may read/write. New projects may use a single root entry;
# existing projects may keep docs/backend/frontend or one entry per service.
repos:
  root: /absolute/path/to/your/repo

# Exact GitHub check-run names required by the Issue-to-merge operator. If this
# mapping is omitted, protected required-status contexts are queried from the
# base branch; if neither source declares checks, operator preflight fails closed.
required_checks:
  backend: backend
  frontend: frontend

# Default worker backend for any role not listed under `workers:` below.
# `fake` needs no credentials and is great for a first end-to-end run. For real
# runs, use `anthropic` (drives the `claude` CLI, set ANTHROPIC_API_KEY) or
# `codex` (drives the `codex` CLI). With `anthropic`, pick model_profile:
# anthropic above so the role models match the backend.
worker_backend:
  mode: fake                     # fake | anthropic | codex | noop (global default)

# Per-role backend overrides. Each role picks its own CLI; anything omitted
# falls back to worker_backend.mode. e.g. run implementation on claude and QA on
# codex by setting `implementation: anthropic` and `qa: codex`. `doctor` reports
# readiness for every backend you reference here.
workers:
  ui: fake
  implementation: fake
  qa: fake

# Local task ledger lives under the target repo's .goodteam/; no external
# tracker required.
task_backend:
  mode: local

# Optional: declare a real model provider so doctor can verify credentials.
# providers:
#   anthropic:
#     type: anthropic
#     api_key_env: ANTHROPIC_API_KEY
#     env_file: .env

# Optional: require functional staging evidence before release (see staging.py).
delivery_contract:
  required: false
