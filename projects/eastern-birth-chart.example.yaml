name: Eastern Birth Chart
key: EBC
plane_project_id: "<plane-project-id>"
repos:
  docs: "<absolute-path-to-eastern-birth-chart-docs>"
  backend: "<absolute-path-to-eastern-birth-chart-api>"
  frontend: "<absolute-path-to-eastern-birth-chart-mvp-gemini-ui>"
task_backend:
  mode: local
  sync:
  plane:
    api_host_url: https://api.plane.so/
    workspace_slug: "<plane-workspace-slug>"
    project_id: "<plane-project-id>"
    api_key_env: PLANE_API_KEY
    mcp_server: plane
workers:
  product: claude
  requirement: claude
  architect: claude
  review: claude
  planner: claude
  backend: codex
  frontend: gemini
  ui: gemini
  qa: codex
  code_review: codex
  release: claude
  retro_memory: claude
providers:
  deepseek:
    type: openai-compatible
    api_key_env: DEEPSEEK_API_KEY
    env_file: .env.local
    base_url: https://api.deepseek.com
role_routes:
  product_requirement: docs
  architect: docs
  planner: docs
  backend: backend
  frontend: frontend
  ui: frontend
  qa: docs
  release: docs
  retro_memory: docs
